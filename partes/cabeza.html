<!-- script bloqueante: clase «js», entrar siempre arriba (checklist 12) y el mando de maqueta. La estación la pone
     js/estacion.js, justo detrás y también bloqueante (pesa 2 KB), para que el acento no salte al pintar. -->
<script>
(function (d, w) {
  var h = d.documentElement;
  h.classList.add('js');
  w.Freixe = w.Freixe || {};
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  if (!location.hash) w.scrollTo(0, 0);
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('sin-webgl')) h.classList.add('sin-webgl');
    // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
})(document, window);
</script>
<script src="js/estacion.js"></script>
